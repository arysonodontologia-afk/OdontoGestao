# Publica o sistema (Firebase Hosting) e as regras de segurança (Firestore).
#  • branch "teste" -> projeto de TESTE (você valida antes)
#  • branch "main"  -> PRODUÇÃO (todas as clínicas)
name: Publicar no Firebase
on:
  push:
    branches: [main, teste]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Conferir configuração
        run: |
          if [ "$GITHUB_REF_NAME" = "teste" ] && grep -q "COLOQUE-O-ID-DO-PROJETO-DE-TESTE" .firebaserc; then
            echo "::error::Preencha o ID do projeto de teste no arquivo .firebaserc"; exit 1; fi
          if grep -q "SEU-EMAIL@gmail.com" firestore.rules; then
            echo "::error::Troque o e-mail do responsável no arquivo firestore.rules"; exit 1; fi
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta a chave do Firebase nos secrets do GitHub (FIREBASE_SERVICE_ACCOUNT ou, no teste, FIREBASE_SERVICE_ACCOUNT_TESTE)"; exit 1; fi
        env:
          CHAVE: ${{ github.ref_name == 'teste' && secrets.FIREBASE_SERVICE_ACCOUNT_TESTE || secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publicar
        env:
          CHAVE: ${{ github.ref_name == 'teste' && secrets.FIREBASE_SERVICE_ACCOUNT_TESTE || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/chave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/chave.json"
          set +e
          if [ "$GITHUB_REF_NAME" = "teste" ]; then ALVO=teste; else ALVO=default; fi
          echo "Publicando no projeto: $ALVO"
          npx --yes firebase-tools@13 deploy --project "$ALVO" --only hosting,firestore:rules --non-interactive 2>&1 | tee "$RUNNER_TEMP/saida.txt"
          st=${PIPESTATUS[0]}
          if [ "$st" != "0" ]; then
            grep -iE "error|erro|permission|denied|not enabled|has not been used|forbidden|403|404" "$RUNNER_TEMP/saida.txt" | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            if [ -f firebase-debug.log ]; then grep -E "<<< \[apiv2\]\[(status|body)\]" firebase-debug.log | cut -c1-300 | tail -6 | while IFS= read -r l; do echo "::error::$l"; done; fi
          fi
          exit $st
      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.json" "$RUNNER_TEMP/saida.txt"
