# Publica o Worker do WhatsApp automático (Cloudflare) e grava o endereço em plataforma/wa.
# branch teste -> odontogestao-wa-teste (projeto de teste); main -> odontogestao-wa (produção).
# Segredos: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FIREBASE_WA_SA / FIREBASE_WA_SA_TESTE
# (conta de serviço com permissão mínima no Firestore), WA_VERIFY_TOKEN e WA_APP_SECRET (Meta).
name: Worker do WhatsApp automático
on:
  push:
    branches: [main, teste]
    paths: ['wa/**', '.github/workflows/wa-worker.yml']
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_SA: ${{ github.ref_name == 'teste' && secrets.FIREBASE_WA_SA_TESTE || secrets.FIREBASE_WA_SA }}
      WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
      WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Conferir segredos
        id: seg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Faltam os segredos do Cloudflare."; echo "ok=nao" >> $GITHUB_OUTPUT; else echo "ok=sim" >> $GITHUB_OUTPUT; fi
      - name: Publicar o Worker
        if: steps.seg.outputs.ok == 'sim'
        id: pub
        working-directory: wa
        run: |
          AMB=""; [ "${GITHUB_REF_NAME}" = "teste" ] && AMB="--env teste"
          npx --yes wrangler@3.99.0 deploy $AMB 2>&1 | tee ../deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' ../deploy.log | head -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          for S in GOOGLE_SA WA_VERIFY_TOKEN WA_APP_SECRET; do
            V="${!S}"
            if [ -n "$V" ]; then printf '%s' "$V" | npx --yes wrangler@3.99.0 secret put $S $AMB; else echo "Sem $S (ainda): parte do serviço fica parada."; fi
          done
      - name: Gravar o endereço no Firebase
        if: steps.seg.outputs.ok == 'sim'
        env:
          URL_IA: ${{ steps.pub.outputs.url }}
          DOC: wa
          CHAVE: ${{ github.ref_name == 'teste' && secrets.FIREBASE_SERVICE_ACCOUNT_TESTE || secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJETO: ${{ github.ref_name == 'teste' && 'odontogestao-teste' || 'odontogestao-c8218' }}
        run: |
          pip install --quiet google-auth requests
          python3 .github/gravar_ia.py
