<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OdontoGestão</title>
<meta name="theme-color" content="#F5F6F8">
<script>(function(){var t='auto';try{t=localStorage.getItem('odonto-tema')||'auto'}catch(e){}var d=t==='auto'?((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):t;document.documentElement.setAttribute('data-theme',d);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OdontoGestão">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<script>
// Ambiente de teste: ícone, nome e cor diferentes para não confundir com a produção
if(/odontogestao-teste/.test(location.hostname)){
  document.title='TESTE · OdontoGestão';
  document.querySelector('link[rel=manifest]').href='manifest-teste.json';
  document.querySelector('link[rel=icon]').href='icones/teste-icone-192.png';
  document.querySelector('link[rel=apple-touch-icon]').href='icones/teste-apple-touch-icon.png';
  document.querySelector('meta[name=apple-mobile-web-app-title]').content='Odonto TESTE';
  document.querySelector('meta[name=theme-color]').content='#C9861A';
}
</script>
<link rel="stylesheet" href="estilo.css?v=2.19.0">
</head>
<body>
<div id="app"><div class="wrap"><p class="muted" style="text-align:center;margin-top:30vh">Carregando…</p></div></div>
<div id="printArea"></div>
<script src="firebase-config.js?v=2.19.0"></script>
<script src="nuvem.js?v=2.19.0"></script>
<script src="versoes.js?v=2.19.0"></script>
<script src="datas.js?v=2.19.0"></script>
<script src="app.js?v=2.19.0"></script>
<script>
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)));
}
</script>
</body>
</html>
