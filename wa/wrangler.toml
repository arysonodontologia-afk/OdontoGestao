# Worker do WhatsApp automático. Publicado pelo GitHub (.github/workflows/wa-worker.yml).
name = "odontogestao-wa"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
PROJETO = "odontogestao-c8218"
GRAPH = "v21.0"

[env.teste]
name = "odontogestao-wa-teste"
workers_dev = true

[env.teste.triggers]
crons = ["*/5 * * * *"]

[env.teste.vars]
PROJETO = "odontogestao-teste"
GRAPH = "v21.0"
